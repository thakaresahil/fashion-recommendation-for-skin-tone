services:
  huematch:
    build:
      context: .
      args:
        FETCH_IMAGES: ${FETCH_IMAGES:-true}
        IMAGE_SAMPLE: ${IMAGE_SAMPLE:-}
        INSTALL_ML: ${INSTALL_ML:-false}
    image: huematch:latest
    ports:
      - "8000:8000"
    volumes:
      # Optional: embeddings from scripts/build_embeddings.py.
      - ./data/embeddings:/app/data/embeddings:ro
    restart: unless-stopped
